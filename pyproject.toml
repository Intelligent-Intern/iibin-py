[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "iibin"
version = "2.0.0a2"
description = "IIBIN 2 native schema codec for Python, JavaScript and King; distinct from legacy JS 1.x"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["iibin", "serialization", "binary", "protobuf", "codec"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: C",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/doc/iibin" = ["MIGRATION.md", "CHANGELOG.md"]

[project.urls]
Repository = "https://github.com/Intelligent-Intern/iibin-py"
Issues = "https://github.com/Intelligent-Intern/iibin-py/issues"
